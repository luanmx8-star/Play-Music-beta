<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b7bff">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Vitrola</title>
<style>
/* Layout: full-height app column. Title bar, scrolling library, mini player, tab bar. Now-playing and sheets slide over it. */
:root {
  --bg: #f2f3f5;
  --surface: #ffffff;
  --fg: #111317;
  --muted: #6a7078;
  --line: #e3e5e9;
  --accent: #2b7bff;
  --accent-soft: #e2edff;
  --accent-fg: #ffffff;
  --danger: #d63a3a;
  --scrim: rgba(0, 0, 0, 0.45);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0b0d; --surface: #1a1c20; --fg: #f1f2f4; --muted: #8e949c; --line: #2a2d32;
    --accent: #5b9bff; --accent-soft: #1b2a47; --accent-fg: #06142e; --danger: #ff7070; --scrim: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0b0d; --surface: #1a1c20; --fg: #f1f2f4; --muted: #8e949c; --line: #2a2d32;
  --accent: #5b9bff; --accent-soft: #1b2a47; --accent-fg: #06142e; --danger: #ff7070; --scrim: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
</style>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.4;
  padding-block: 0; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
button:focus-visible, input:focus-visible, .row:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.i { display: inline-grid; place-items: center; width: 24px; height: 24px; flex: none; }
.i svg { width: 100%; height: 100%; fill: currentColor; }

.app { height: 100%; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; min-height: 0; }

/* top bar */
.top { display: flex; align-items: center; gap: 4px; padding: 14px 0 6px; min-height: 64px; }
.top h1 { flex: 1; min-width: 0; margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ib { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--fg); flex: none; }
.ib:hover { background: var(--line); }
.ib.on { color: var(--accent); }
.ib.sm { width: 36px; height: 36px; color: var(--muted); }
.search { padding: 4px 0 8px; }
.search input { width: 100%; height: 44px; border-radius: 22px; border: 0; background: var(--surface); color: var(--fg); padding: 0 18px; font: inherit; }
.search input::placeholder { color: var(--muted); }

/* library */
main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 12px; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0 10px; color: var(--muted); font-size: 14px; }
.sortbtn { display: inline-flex; align-items: center; gap: 4px; color: var(--fg); font-weight: 500; padding: 6px 4px 6px 10px; border-radius: 16px; }
.sortbtn:hover { background: var(--line); }
.sortbtn .i { width: 18px; height: 18px; }
.pills { display: flex; gap: 10px; padding-bottom: 12px; }
.pill { flex: 1; height: 44px; border-radius: 22px; background: var(--accent-soft); color: var(--accent); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.pill.fill { background: var(--accent); color: var(--accent-fg); }
.pill .i { width: 20px; height: 20px; }
.group { background: var(--surface); border-radius: 20px; padding: 6px; }
.row { display: flex; align-items: center; gap: 12px; padding: 8px 4px 8px 8px; border-radius: 14px; cursor: pointer; }
.row:hover { background: var(--bg); }
.row .info { flex: 1; min-width: 0; }
.row .tt { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .aa { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.cur .tt { color: var(--accent); }
.row .favmark { width: 16px; height: 16px; color: var(--accent); flex: none; }
.row .favmark svg { width: 100%; height: 100%; fill: currentColor; }
.tag { display: inline-block; margin-left: 8px; padding: 0 6px; border-radius: 5px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; line-height: 16px; vertical-align: 1px; background: var(--line); color: var(--muted); }
.tag.hq { background: var(--accent-soft); color: var(--accent); }
.q { margin-top: 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.02em; color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q:empty { display: none; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.card { text-align: left; min-width: 0; display: flex; flex-direction: column; gap: 8px; cursor: pointer; border-radius: 16px; }
.card .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .sb { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: -6px; }

.art { background-size: cover; background-position: center; display: grid; place-items: center; color: rgba(255, 255, 255, 0.88); overflow: hidden; flex: none; }
.art .i { width: 46%; height: 46%; }
.art.sm { width: 48px; height: 48px; border-radius: 12px; }
.art.md { width: 100%; aspect-ratio: 1; border-radius: 20px; }
.art.lg { width: 100%; aspect-ratio: 1; border-radius: 28px; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28); }
.art.mini { width: 44px; height: 44px; border-radius: 10px; }
.art.ico { border-radius: 12px; }
.art.ico .i { width: 50%; height: 50%; }

.empty { background: var(--surface); border-radius: 20px; padding: 32px 20px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 14px; align-items: center; }
.empty strong { display: block; color: var(--fg); font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.empty .pill { flex: none; padding: 0 22px; }
.note { font-size: 12px; color: var(--muted); text-align: center; margin: 14px 0 0; }

/* mini player */
.mini { position: relative; display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 18px; padding: 8px 8px 10px 10px; margin-bottom: 8px; cursor: pointer; overflow: hidden; box-shadow: 0 2px 14px rgba(0, 0, 0, 0.1); }
.mini .info { flex: 1; min-width: 0; }
.mini .tt { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini .aa { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini .prog { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--line); }
.mini .prog i { display: block; height: 100%; width: 0; background: var(--accent); }

/* tab bar */
.tabs { display: flex; padding: 6px 0 8px; gap: 4px; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-size: 12px; font-weight: 500; padding: 2px 0; }
.tab .pillbg { width: 56px; height: 30px; border-radius: 15px; display: grid; place-items: center; }
.tab[aria-selected="true"] { color: var(--fg); font-weight: 600; }
.tab[aria-selected="true"] .pillbg { background: var(--accent-soft); color: var(--accent); }

/* now playing */
.player { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow: hidden; visibility: hidden; transform: translateY(100%); transition: transform 0.3s ease, visibility 0.3s; }
.player.open { visibility: visible; transform: none; }
.pbg { position: absolute; inset: -20%; background-size: cover; background-position: center; filter: blur(46px) saturate(1.3); opacity: 0.55; }
.pshade { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent, var(--bg) 82%); }
.pin {
  position: relative; height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.ptop { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; }
.ptop .ctx { font-size: 13px; color: var(--muted); font-weight: 500; text-align: center; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.part { flex: 1; min-height: 0; display: grid; place-items: center; }
.part .art { width: min(100%, 52dvh); }
.ptitle { display: flex; align-items: center; gap: 10px; }
.ptitle .tx { flex: 1; min-width: 0; }
.ptitle .tt { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ptitle .aa { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.times { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: -2px; }
.ctrls { display: flex; align-items: center; justify-content: space-between; }
.ctrls .ib .i { width: 26px; height: 26px; }
.ctrls .play { width: 68px; height: 68px; background: var(--accent); color: var(--accent-fg); }
.ctrls .play:hover { background: var(--accent); filter: brightness(1.08); }
.ctrls .play .i { width: 34px; height: 34px; }
.vrow { display: flex; align-items: center; gap: 10px; color: var(--muted); }
.vrow .i { width: 20px; height: 20px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 24px; background: transparent; margin: 0; --p: 0%; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--accent) var(--p), var(--line) var(--p)); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); margin-top: -6px; border: 0; }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 0; }

/* sheets and toast */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); }
.sheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-width: 640px; margin: 0 auto; background: var(--surface); border-radius: 26px 26px 0 0; max-height: 78%; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); animation: up 0.22s ease; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet h3 { margin: 0; padding: 20px 22px 10px; font-size: 17px; font-weight: 700; }
.sheet .body { overflow-y: auto; padding: 0 10px 14px; }
.item { width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 12px; border-radius: 14px; text-align: left; font-weight: 500; }
.item:hover { background: var(--bg); }
.item.danger { color: var(--danger); }
.item.sel { color: var(--accent); font-weight: 600; }
.item .sub { margin-left: auto; color: var(--muted); font-size: 13px; font-weight: 400; }
.field { display: flex; flex-direction: column; gap: 12px; padding: 4px 12px 8px; }
.field input { height: 48px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); padding: 0 16px; font: inherit; }
.toast { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); text-align: center; }
.dropzone .app { outline: 2px dashed var(--accent); outline-offset: -8px; }
@media (prefers-reduced-motion: reduce) { .player { transition: none; } .sheet { animation: none; } }
</style>

</head>

<div class="app" id="app">
  <header class="top">

    <h1 id="viewTitle">Músicas</h1>
    <button class="ib" id="searchBtn" type="button" aria-label="Buscar"><span class="i"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></span></button>
    <button class="ib" id="addBtn" type="button" aria-label="Adicionar músicas"><span class="i"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></span></button>
  </header>
  <div class="search" id="searchBox" hidden><input id="q" type="search" placeholder="Buscar músicas, álbuns e artistas" autocomplete="off"></div>
  <input id="file" type="file" accept="audio/*,.mp3,.flac,.wav,.wave,.aif,.aiff,.m4a,.mp4,.aac,.ogg,.oga,.opus,.wma,.alac,.weba" multiple hidden>

  <main id="main"></main>

  <div class="mini" id="mini" hidden role="button" tabindex="0" aria-label="Abrir player">
    <div class="art mini" id="miniArt"></div>
    <div class="info"><div class="tt" id="miniTitle"></div><div class="aa" id="miniArtist"></div></div>
    <button class="ib" id="miniPlay" type="button" aria-label="Tocar"></button>
    <button class="ib" id="miniNext" type="button" aria-label="Próxima"></button>
    <div class="prog"><i id="miniProg"></i></div>
  </div>

  <nav class="tabs" role="tablist" aria-label="Biblioteca">
    <button class="tab" type="button" role="tab" data-tab="tracks"></button>
    <button class="tab" type="button" role="tab" data-tab="albums"></button>
    <button class="tab" type="button" role="tab" data-tab="artists"></button>
    <button class="tab" type="button" role="tab" data-tab="playlists"></button>
  </nav>
</div>

<section class="player" id="player" aria-label="Tocando agora">
  <div class="pbg" id="pbg"></div><div class="pshade"></div>
  <div class="pin">
    <div class="ptop">
      <button class="ib" id="pclose" type="button" aria-label="Fechar player"></button>
      <div class="ctx" id="pctx">Tocando agora</div>
      <button class="ib" id="pqueue" type="button" aria-label="Fila de reprodução"></button>
    </div>
    <div class="part"><div class="art lg" id="part"></div></div>
    <div class="ptitle">
      <div class="tx"><div class="tt" id="ptitle"></div><div class="aa" id="partist"></div><div class="q" id="pquality"></div></div>
      <button class="ib" id="pfav" type="button" aria-label="Favoritar"></button>
    </div>
    <div>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Posição da música">
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>
    <div class="ctrls">
      <button class="ib" id="shuffle" type="button" aria-label="Aleatório" aria-pressed="false"></button>
      <button class="ib" id="prev" type="button" aria-label="Anterior"></button>
      <button class="ib play" id="play" type="button" aria-label="Tocar"></button>
      <button class="ib" id="next" type="button" aria-label="Próxima"></button>
      <button class="ib" id="repeat" type="button" aria-label="Repetir: desligado"></button>
    </div>
    <div class="vrow"><span class="i" id="volIcon"></span><input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume"></div>
  </div>
</section>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><h3 id="sheetTitle"></h3><div class="body" id="sheetBody"></div></div>
<div class="toast" id="toast" hidden></div>

    r.appendChild(more);
    r.addEventListener("click", function () { playList(list, i, opts && opts.ctx || "Tocando agora"); });
    r.addEventListener("keydown", function (e) { if (e.key === "Enter") playList(list, i, opts && opts.ctx || "Tocando agora"); });
    return r;
  }
  function trackGroup(parent, list, opts) {
    var g = el("div", "group");
    list.forEach(function (t, i) { g.appendChild(trackRow(t, list, i, opts)); });
    parent.appendChild(g);
  }
  function playPills(parent, list, name) {
    var w = el("div", "pills");
    var a = el("button", "pill fill"); a.type = "button"; a.appendChild(ico("play")); a.appendChild(el("span", null, "Tocar tudo"));
    a.addEventListener("click", function () { shuffleOn = false; syncModes(); playList(list, 0, name); });
    var b = el("button", "pill"); b.type = "button"; b.appendChild(ico("shuffle")); b.appendChild(el("span", null, "Aleatório"));
    b.addEventListener("click", function () { shuffleOn = true; syncModes(); playList(list, Math.floor(Math.random() * list.length), name); });
    w.appendChild(a); w.appendChild(b); parent.appendChild(w);
  }
  function emptyLibrary(main) {
    var e = el("div", "empty");
    var s = el("div"); s.appendChild(el("strong", null, "Sua biblioteca está vazia")); s.appendChild(document.createTextNode("Adicione músicas do seu aparelho. Aceita MP3, FLAC, WAV, M4A, OGG, OPUS e outros. Capas e dados da faixa são lidos automaticamente."));
    var b = el("button", "pill fill", "Adicionar músicas"); b.type = "button"; b.addEventListener("click", function () { $("file").click(); });
    e.appendChild(s); e.appendChild(b); main.appendChild(e);
  }
  function emptyNote(main, title, sub) {
    var e = el("div", "empty"); var s = el("div"); s.appendChild(el("strong", null, title)); s.appendChild(document.createTextNode(sub)); e.appendChild(s); main.appendChild(e);
  }

  function viewTracks(main) {
    if (!lib.length) { emptyLibrary(main); return; }
    var list = sortedTracks(lib.filter(match));
    if (!list.length) { emptyNote(main, "Nada encontrado", "Tente outro nome de música, álbum ou artista."); return; }
    var bar = el("div", "bar"); bar.appendChild(el("span", null, plural(list.length, "música", "músicas")));
    var sb = el("button", "sortbtn"); sb.type = "button";
    sb.appendChild(el("span", null, { title: "Título", artist: "Artista", recent: "Recentes" }[state.sort])); sb.appendChild(ico("sort"));
    sb.addEventListener("click", sortSheet); bar.appendChild(sb); main.appendChild(bar);
    playPills(main, list, "Todas as músicas");
    trackGroup(main, list, { ctx: "Todas as músicas" });
  }
  function viewAlbums(main) {
    if (!lib.length) { emptyLibrary(main); return; }
    var gs = group(function (t) { return t.album || UNK_ALBUM; }).filter(function (g) { return !query || g.key.toLowerCase().indexOf(query.toLowerCase()) >= 0 || g.tracks.some(match); });
    if (!gs.length) { emptyNote(main, "Nada encontrado", "Tente outro nome."); return; }
    var grid = el("div", "grid");
    gs.forEach(function (g) {
      var c = el("button", "card"); c.type = "button";
      var withArt = g.tracks.filter(function (t) { return t.artUrl; })[0] || g.tracks[0];
      c.appendChild(artEl(withArt, "md", g.key));
      c.appendChild(el("div", "nm", g.key));
      var artists = g.tracks.map(function (t) { return t.artist; }).filter(function (v, i, a) { return a.indexOf(v) === i; });
      c.appendChild(el("div", "sb", (artists.length > 1 ? "Vários artistas" : artists[0]) + " · " + g.tracks.length));
      c.addEventListener("click", function () { detail = { type: "album", key: g.key }; render(true); });
      grid.appendChild(c);
    });
    main.appendChild(grid);
  }
  function viewArtists(main) {
    if (!lib.length) { emptyLibrary(main); return; }
    var gs = group(function (t) { return t.artist; }).filter(function (g) { return !query || g.key.toLowerCase().indexOf(query.toLowerCase()) >= 0 || g.tracks.some(match); });
    if (!gs.length) { emptyNote(main, "Nada encontrado", "Tente outro nome."); return; }
    var box = el("div", "group");
    gs.forEach(function (g) {
      var r = el("div", "row"); r.tabIndex = 0; r.setAttribute("role", "button");
      var withArt = g.tracks.filter(function (t) { return t.artUrl; })[0] || g.tracks[0];
      var a = artEl(withArt, "sm", g.key); a.style.borderRadius = "50%"; r.appendChild(a);
      var info = el("div", "info"); info.appendChild(el("div", "tt", g.key)); info.appendChild(el("div", "aa", plural(g.tracks.length, "música", "músicas"))); r.appendChild(info);
      function open() { detail = { type: "artist", key: g.key }; render(true); }
      r.addEventListener("click", open); r.addEventListener("keydown", function (e) { if (e.key === "Enter") open(); });
      box.appendChild(r);
    });
    main.appendChild(box);
  }
  function listRow(box, icon, hueKey, name, sub, fn) {
    var r = el("div", "row"); r.tabIndex = 0; r.setAttribute("role", "button");
    var a = el("div", "art sm ico"); a.style.backgroundImage = "linear-gradient(135deg, hsl(" + hue(hueKey) + " 62% 60%), hsl(" + ((hue(hueKey) + 45) % 360) + " 62% 40%))"; a.appendChild(ico(icon)); r.appendChild(a);
    var info = el("div", "info"); info.appendChild(el("div", "tt", name)); info.appendChild(el("div", "aa", sub)); r.appendChild(info);
    r.addEventListener("click", fn); r.addEventListener("keydown", function (e) { if (e.key === "Enter") fn(); });
    box.appendChild(r);
  }
  function viewPlaylists(main) {
    var add = el("div", "pills"); var nb = el("button", "pill fill"); nb.type = "button"; nb.appendChild(ico("add")); nb.appendChild(el("span", null, "Nova playlist"));
    nb.addEventListener("click", function () { newPlaylistSheet(null); }); add.appendChild(nb); main.appendChild(add);
    var box = el("div", "group");
    listRow(box, "heart", "favoritas", "Favoritas", plural(state.fav.filter(byId).length, "música", "músicas"), function () { detail = { type: "fav" }; render(true); });
    state.playlists.forEach(function (p) {
      listRow(box, "queue", p.name, p.name, plural(p.ids.filter(byId).length, "música", "músicas"), function () { detail = { type: "playlist", key: p.id }; render(true); });
    });
    main.appendChild(box);
    if (!state.playlists.length) main.appendChild(el("p", "note", "Crie playlists e adicione músicas pelo menu de cada faixa."));
  }
  function viewDetail(main) {
    var list = detailList();
    if (detail.type === "album" || detail.type === "artist") {
      var head = el("div", "bar"); head.appendChild(el("span", null, plural(list.length, "música", "músicas"))); main.appendChild(head);
    }
    if (!list.length) { emptyNote(main, "Nada por aqui", detail.type === "playlist" || detail.type === "fav" ? "Adicione músicas pelo menu de cada faixa." : "Esta lista está vazia."); }
    else {
      if (detail.type === "playlist" || detail.type === "fav") { var h = el("div", "bar"); h.appendChild(el("span", null, plural(list.length, "música", "músicas"))); main.appendChild(h); }
      playPills(main, list, detailName());
      trackGroup(main, list, { ctx: detailName(), playlistId: detail.type === "playlist" ? detail.key : null });
    }
    if (detail.type === "playlist") {
      var del = el("button", "pill", "Excluir playlist"); del.type = "button"; del.style.marginTop = "14px"; del.style.width = "100%"; del.style.color = "var(--danger)";
      del.addEventListener("click", function () {
        state.playlists = state.playlists.filter(function (x) { return x.id !== detail.key; }); saveState(); detail = null; render(true); toast("Playlist excluída");
      });
      main.appendChild(del);
    }
  }

  function render(reset) {
    var main = $("main"), st = main.scrollTop;
    main.textContent = "";
    $("back").hidden = !detail;
    $("viewTitle").textContent = detail ? detailName() : TABS[tab][0];
    document.querySelectorAll(".tab").forEach(function (b) { b.setAttribute("aria-selected", String(b.dataset.tab === tab)); });
    if (detail) viewDetail(main);
    else if (tab === "tracks") viewTracks(main);
    else if (tab === "albums") viewAlbums(main);
    else if (tab === "artists") viewArtists(main);
    else viewPlaylists(main);
    if (!lib.length && !detail && tab !== "playlists") main.appendChild(el("p", "note", "As músicas ficam guardadas só neste navegador."));
    main.scrollTop = reset ? 0 : st;
  }
  function markCurrent() {
    var c = cur();
    document.querySelectorAll(".row[data-id]").forEach(function (r) { r.classList.toggle("cur", !!c && r.dataset.id === String(c.id)); });
  }

  // ---- playback ----
  function playList(list, start, name) {
    if (!list.length) return;
    queue = list.slice(); qi = start; ctxName = name || "Tocando agora";
    loadCurrent(true);
  }
  function loadCurrent(autoplay) {
    var t = cur(); if (!t) return;
    audio.src = t.url;
    $("seek").value = 0; fill($("seek")); $("cur").textContent = "0:00"; $("dur").textContent = fmt(t.dur); $("miniProg").style.width = "0";
    updateNow();
    if (autoplay) { var p = audio.play(); if (p && p.catch) p.catch(function () { toast("Não foi possível tocar este arquivo."); updatePlayIcons(); }); }
  }
  function toggle() {
    if (!cur()) return;
    if (audio.paused) { var p = audio.play(); if (p && p.catch) p.catch(function () { toast("Não foi possível tocar este arquivo."); }); }
    else audio.pause();
  }
  function step(dir) {
    if (!queue.length) return;
    var n;
    if (shuffleOn && queue.length > 1 && dir > 0) { do { n = Math.floor(Math.random() * queue.length); } while (n === qi); }
    else n = qi + dir;
    if (n >= queue.length) n = 0;
    if (n < 0) n = queue.length - 1;
    qi = n; loadCurrent(true);
  }
  function prev() { if (audio.currentTime > 3) { audio.currentTime = 0; return; } step(-1); }
  function stopAll() { audio.pause(); audio.removeAttribute("src"); audio.load(); queue = []; qi = -1; }
  function toggleFav(t) {
    var i = state.fav.indexOf(t.id);
    if (i >= 0) state.fav.splice(i, 1); else state.fav.push(t.id);
    saveState(); render(); updateNow();
  }
  function removeTrack(t) {
    var wasPlaying = !audio.paused, qpos = queue.indexOf(t);
    lib = lib.filter(function (x) { return x !== t; });
    state.fav = state.fav.filter(function (id) { return id !== t.id; });
    state.playlists.forEach(function (p) { p.ids = p.ids.filter(function (id) { return id !== t.id; }); });
    saveState();
    req("tracks", "readwrite", function (s) { s.delete(t.id); }).catch(function () {});
    if (qpos >= 0) {
      var wasCur = qpos === qi;
      queue.splice(qpos, 1);
      if (qpos < qi) qi--;
      if (wasCur) { if (queue.length) { if (qi >= queue.length) qi = 0; loadCurrent(wasPlaying); } else stopAll(); }
    }
    try { URL.revokeObjectURL(t.url); if (t.artUrl) URL.revokeObjectURL(t.artUrl); } catch (e) {}
    render(); updateNow();
  }

  function updatePlayIcons() {
    var playing = !audio.paused;
    put($("play"), playing ? "pause" : "play"); $("play").setAttribute("aria-label", playing ? "Pausar" : "Tocar");
    put($("miniPlay"), playing ? "pause" : "play"); $("miniPlay").setAttribute("aria-label", playing ? "Pausar" : "Tocar");
  }
  function updateNow() {
    var t = cur();
    $("mini").hidden = !t;
    if (t) {
      $("miniTitle").textContent = t.title; $("miniArtist").textContent = t.artist; paintArt($("miniArt"), t);
      $("ptitle").textContent = t.title; $("partist").textContent = t.artist + (t.album ? " · " + t.album : ""); paintArt($("part"), t);
      $("pctx").textContent = ctxName; $("pquality").textContent = qualityLine(t);
      var bg = $("pbg");
      if (t.artUrl) bg.style.backgroundImage = 'url("' + t.artUrl + '")';
      else { var h = hue(t.album || t.title); bg.style.backgroundImage = "linear-gradient(135deg, hsl(" + h + " 62% 60%), hsl(" + ((h + 45) % 360) + " 62% 40%))"; }
      put($("pfav"), isFav(t) ? "heart" : "hearto"); $("pfav").classList.toggle("on", isFav(t));
      $("pfav").setAttribute("aria-label", isFav(t) ? "Remover das favoritas" : "Favoritar");
      document.title = t.title + " · Vitrola";
      if ("mediaSession" in navigator) { try { navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, album: t.album }); } catch (e) {} }
    } else { document.title = "Vitrola"; closePlayer(); }
    updatePlayIcons(); markCurrent();
  }
  function syncModes() {
    $("shuffle").classList.toggle("on", shuffleOn); $("shuffle").setAttribute("aria-pressed", String(shuffleOn));
    var labels = ["desligado", "todas", "uma"];
    $("repeat").classList.toggle("on", repeatMode > 0); $("repeat").setAttribute("aria-label", "Repetir: " + labels[repeatMode]);
    put($("repeat"), repeatMode === 2 ? "repeat1" : "repeat");
  }
  function openPlayer() { if (cur()) $("player").classList.add("open"); }
  function closePlayer() { $("player").classList.remove("open"); }

  // ---- adding files ----
  function addFiles(fileList) {
    var files = Array.prototype.slice.call(fileList).filter(function (f) { return f.type.indexOf("audio") === 0 || /\.(mp3|m4a|mp4|aac|wav|wave|aif|aiff|ogg|oga|opus|flac|alac|wma|weba)$/i.test(f.name); });
    if (!files.length) { toast("Nenhum arquivo de áudio encontrado."); return; }
    toast("Importando " + plural(files.length, "arquivo", "arquivos") + "…");
    var saved = true, added = 0, base = Date.now();
    var chain = Promise.resolve();
    files.forEach(function (f, i) {
      chain = chain.then(function () {
        return Promise.all([readMeta(f), getDur(f)]).then(function (r) {
          var m = r[0], rec = { title: m.title, artist: m.artist, album: m.album, blob: f, art: m.art, dur: r[1], added: base + i, codec: m.codec || "", rate: m.rate || 0, bits: m.bits || 0 };
          return req("tracks", "readwrite", function (s) { return s.add(rec); }).then(function (id) { rec.id = id; }, function () { rec.id = "tmp" + Math.random().toString(36).slice(2); saved = false; })
            .then(function () { lib.push(mk(rec)); added++; render(); });
        });
      });
    });
    chain.then(function () { toast(plural(added, "música adicionada", "músicas adicionadas") + (saved ? "" : " (sem salvar no navegador)")); });
  }

  // ---- wiring ----
  $("addBtn").addEventListener("click", function () { $("file").click(); });
  $("file").addEventListener("change", function (e) { addFiles(e.target.files); e.target.value = ""; });
  $("back").addEventListener("click", function () { detail = null; render(true); });
  document.querySelectorAll(".tab").forEach(function (b) {
    var d = TABS[b.dataset.tab];
    var pb = el("span", "pillbg"); pb.appendChild(ico(d[1])); b.appendChild(pb); b.appendChild(el("span", null, d[0]));
    b.addEventListener("click", function () { tab = b.dataset.tab; detail = null; render(true); });
  });
  $("searchBtn").addEventListener("click", function () {
    var box = $("searchBox"); box.hidden = !box.hidden;
    if (box.hidden) { query = ""; $("q").value = ""; render(); } else $("q").focus();
  });
  $("q").addEventListener("input", function (e) { query = e.target.value.trim(); render(true); });
  $("scrim").addEventListener("click", closeSheet);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { if (!$("sheet").hidden) closeSheet(); else closePlayer(); } });

  $("mini").addEventListener("click", openPlayer);
  $("mini").addEventListener("keydown", function (e) { if (e.key === "Enter") openPlayer(); });
  $("miniPlay").addEventListener("click", function (e) { e.stopPropagation(); toggle(); });
  $("miniNext").addEventListener("click", function (e) { e.stopPropagation(); step(1); });
  $("pclose").addEventListener("click", closePlayer);
  $("pqueue").addEventListener("click", queueSheet);
  $("pfav").addEventListener("click", function () { var t = cur(); if (t) toggleFav(t); });
  $("play").addEventListener("click", toggle);
  $("next").addEventListener("click", function () { step(1); });
  $("prev").addEventListener("click", prev);
  $("shuffle").addEventListener("click", function () { shuffleOn = !shuffleOn; syncModes(); });
  $("repeat").addEventListener("click", function () { repeatMode = (repeatMode + 1) % 3; syncModes(); });

  var seek = $("seek"), seeking = false;
  seek.addEventListener("input", function () { seeking = true; fill(seek); if (isFinite(audio.duration)) $("cur").textContent = fmt(seek.value / 1000 * audio.duration); });
  seek.addEventListener("change", function () { if (isFinite(audio.duration)) audio.currentTime = seek.value / 1000 * audio.duration; seeking = false; });
  var vol = $("vol"); vol.addEventListener("input", function () { audio.volume = vol.value / 100; fill(vol); });
  fill(vol);

  audio.addEventListener("timeupdate", function () {
    if (!isFinite(audio.duration) || !audio.duration) return;
    var p = audio.currentTime / audio.duration;
    $("miniProg").style.width = (p * 100) + "%";
    if (seeking) return;
    seek.value = Math.round(p * 1000); fill(seek); $("cur").textContent = fmt(audio.currentTime);
  });
  audio.addEventListener("loadedmetadata", function () {
    $("dur").textContent = fmt(audio.duration);
    var t = cur(); if (t && !t.dur && isFinite(audio.duration)) { t.dur = audio.duration; }
  });
  audio.addEventListener("play", function () { updatePlayIcons(); });
  audio.addEventListener("pause", function () { updatePlayIcons(); });
  audio.addEventListener("error", function () {
    if (audio.getAttribute("src")) { var ct = cur(); toast("Este navegador não toca " + (ct ? fmtName(ct) || "este formato" : "este formato") + "."); }
    updatePlayIcons();
  });
  audio.addEventListener("ended", function () {
    if (repeatMode === 2) { audio.currentTime = 0; audio.play(); return; }
    if (qi === queue.length - 1 && repeatMode === 0 && !shuffleOn) { audio.currentTime = 0; seek.value = 0; fill(seek); $("miniProg").style.width = "0"; updatePlayIcons(); return; }
    step(1);
  });
  if ("mediaSession" in navigator) {
    try {
      navigator.mediaSession.setActionHandler("play", toggle); navigator.mediaSession.setActionHandler("pause", toggle);
      navigator.mediaSession.setActionHandler("nexttrack", function () { step(1); }); navigator.mediaSession.setActionHandler("previoustrack", prev);
    } catch (e) {}
  }

  ["dragenter", "dragover"].forEach(function (ev) { window.addEventListener(ev, function (e) { e.preventDefault(); document.body.classList.add("dropzone"); }); });
  ["dragleave", "drop"].forEach(function (ev) { window.addEventListener(ev, function (e) { e.preventDefault(); document.body.classList.remove("dropzone"); }); });
  window.addEventListener("drop", function (e) { if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files); });

  // static icons
  put($("pclose"), "down"); put($("pqueue"), "queue"); put($("shuffle"), "shuffle"); put($("prev"), "prev"); put($("next"), "next");
  put($("miniNext"), "next"); put($("volIcon"), "vol"); put($("pfav"), "hearto");
  updatePlayIcons(); syncModes(); render(true);

  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  // restore saved library
  req("kv", "readonly", function (s) { return s.get("state"); }).then(function (s) {
    if (s) { state.fav = s.fav || []; state.playlists = s.playlists || []; state.sort = s.sort || "title"; }
  }).catch(function () {}).then(function () {
    return req("tracks", "readonly", function (s) { return s.getAll(); });
  }).then(function (rows) {
    if (rows && rows.length) lib = rows.map(mk);
    render(true);
  }).catch(function () {});
})();
</script>

</body>
</html>
